<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Finalizar compra — Design Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600&family=Poppins:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,800&family=Work+Sans:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/styles.css">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
</head>
<body>
<div id="ds-header"></div>

<main class="checkout" id="checkout">
  <form id="orderForm" name="pedido" method="POST" data-netlify="true" netlify-honeypot="bot-field" novalidate>
    <h1>Finalizar compra</h1>
    <input type="hidden" name="form-name" value="pedido">
    <p hidden><label>No completar: <input name="bot-field"></label></p>
    <input type="hidden" name="orden" id="fOrden">
    <input type="hidden" name="detalle" id="fDetalle">
    <input type="hidden" name="total" id="fTotal">
    <input type="hidden" name="comision_fotografas" id="fComision">
    <input type="hidden" name="envio" id="fEnvio">

    <div class="box">
      <h2><span class="step">1</span> Datos de contacto</h2>
      <div class="fields">
        <label class="f full">Email<input type="email" name="email" required autocomplete="email"></label>
        <label class="f">Nombre y apellido<input name="nombre" required autocomplete="name"></label>
        <label class="f">Teléfono<input type="tel" name="telefono" required autocomplete="tel"></label>
      </div>
    </div>

    <div class="box">
      <h2><span class="step">2</span> Entrega</h2>
      <label class="choice"><input type="radio" name="entrega" value="Envío a domicilio" checked><span><b>Envío a domicilio</b><span id="shipNote"></span></span></label>
      <label class="choice"><input type="radio" name="entrega" value="Retiro por el estudio"><span><b>Retiro por el estudio</b><span>Sin cargo. Coordinamos día y horario.</span></span></label>
      <div class="fields" id="addr">
        <label class="f">Calle<input name="direccion" autocomplete="address-line1"></label>
        <label class="f">Número<input name="numero" inputmode="numeric"></label>
        <label class="f">Piso / depto (opcional)<input name="depto" autocomplete="address-line2"></label>
        <label class="f">DNI (lo pide el transporte)<input name="dni" inputmode="numeric"></label>
        <label class="f">Código postal<input name="cp" autocomplete="postal-code"></label>
        <label class="f">Ciudad<input name="ciudad" autocomplete="address-level2"></label>
        <label class="f">Provincia
          <select name="provincia" autocomplete="address-level1">
            <option value="">Elegí…</option>
            <option>CABA</option><option>Buenos Aires</option><option>Catamarca</option><option>Chaco</option><option>Chubut</option><option>Córdoba</option><option>Corrientes</option><option>Entre Ríos</option><option>Formosa</option><option>Jujuy</option><option>La Pampa</option><option>La Rioja</option><option>Mendoza</option><option>Misiones</option><option>Neuquén</option><option>Río Negro</option><option>Salta</option><option>San Juan</option><option>San Luis</option><option>Santa Cruz</option><option>Santa Fe</option><option>Santiago del Estero</option><option>Tierra del Fuego</option><option>Tucumán</option>
          </select>
        </label>
        <p class="ship-quote full" id="shipQuote" hidden></p>
      </div>
    </div>

    <div class="box">
      <h2><span class="step">3</span> Pago</h2>
      <label class="choice"><input type="radio" name="pago" value="Mercado Pago" checked><span><b>Mercado Pago</b><span>Tarjetas de crédito, débito o dinero en cuenta. <span id="maxInst"></span>.</span></span></label>
      <label class="choice"><input type="radio" name="pago" value="Transferencia"><span><b>Transferencia bancaria <span class="tag-ok" id="trTag"></span></b><span>Al confirmar te mostramos el alias y CBU para transferir en el momento.</span></span></label>
      <label class="f">Comentarios (opcional)<textarea name="comentarios" rows="2"></textarea></label>
    </div>

    <button class="btn btn-dark btn-block" type="submit" id="payBtn">Continuar al pago</button>
    <p class="error" id="err" hidden></p>
    <p class="secure">🔒 Pago procesado de forma segura por Mercado Pago</p>
  </form>

  <aside class="summary box" id="summary">
    <h2>Tu pedido</h2>
    <div id="sumLines"></div>
    <div class="sum-rows">
      <div class="row"><span>Subtotal</span><span id="sSub"></span></div>
      <div class="row discount" id="sDiscRow" hidden><span>Descuento transferencia</span><span id="sDisc"></span></div>
      <div class="row"><span>Envío</span><span id="sShip"></span></div>
      <div class="row total"><span>Total</span><strong id="sTotal"></strong></div>
    </div>
  </aside>
</main>

<section class="done" id="done" hidden>
  <h1 id="dTitle">¡Gracias por tu compra!</h1>
  <p id="dText"></p>
  <div class="bank" id="dBank" hidden></div>
  <a class="btn btn-dark wa-btn" id="dWa" target="_blank" rel="noopener" hidden>Enviar comprobante por WhatsApp</a>
  <a class="btn btn-dark" href="/">Volver a la tienda</a>
</section>

<div id="ds-footer"></div>

<script src="/assets/store.js"></script>
<script>
(async () => {
  const c = await DS.init();
  const st = c.store;
  const $ = (id) => document.getElementById(id);
  const form = $("orderForm");
  const pct = Math.round(st.transferDiscount * 100);

  $("maxInst").textContent = `Hasta ${st.interestFree} cuotas sin interés`;
  $("trTag").textContent = pct ? `${pct}% OFF` : "";
  $("shipNote").textContent = st.shippingText;

  const val = (n) => (form.querySelector(`[name="${n}"]:checked`) || form.elements[n]).value;

  // ---- modo "pedido a medida": viene con ?p=<link firmado>
  const PTOK = new URLSearchParams(location.search).get("p");
  let PRE = null;
  if (PTOK) {
    const r = await fetch("/api/presupuesto?p=" + encodeURIComponent(PTOK)).catch(() => null);
    const d = r ? await r.json().catch(() => ({})) : {};
    if (!r || !r.ok || d.error) {
      $("checkout").innerHTML = `<div class="done" style="grid-column:1/-1"><h1>No pudimos abrir tu presupuesto</h1><p>${DS.esc(d.error || "Revisá el link o escribinos.")}</p><a class="btn btn-dark" href="http://wa.link/vp5yn9" target="_blank" rel="noopener">Escribinos por WhatsApp</a></div>`;
      return;
    }
    PRE = d;
    document.querySelector("#summary h2").textContent = "Tu pedido a medida";
    document.querySelector("#checkout h1").textContent = PRE.cliente ? `Hola ${PRE.cliente.split(" ")[0]}, completá tu pedido` : "Completá tu pedido";
  }
  const preSub = () => PRE.items.reduce((a, i) => a + i.precio, 0) + (PRE.envio || 0);
  const discOn = () => (PRE ? PRE.descTransfer : true);
  const subTotal = () => (PRE ? preSub() : DS.cartTotal(DS.getCart()));
  const detalle = () => PRE
    ? PRE.items.map((i) => `${i.cant} × ${i.desc} — ${DS.money(i.precio)}`).concat(PRE.envio ? [`Envío — ${DS.money(PRE.envio)}`] : []).join("\n") + (PRE.nota ? `\nNota: ${PRE.nota}` : "")
    : DS.getCart().map((l) => `${l.qty} × ${DS.product(l.productId).name} (${DS.variantText(l)}) — ${DS.money(DS.unitPrice(l) * l.qty)}`).join("\n");

  // ---- envío: se cotiza con Zipnova cuando están CP, ciudad y provincia
  let ENV = null, envKey = "", envTimer = 0, envSeq = 0;   // ENV = { modo, precio, carrier, min, max, token } | { modo: "coordinar" } | { modo: "cargando" }
  const domicilio = () => val("entrega") === "Envío a domicilio";
  const envDatos = () => ({ cp: form.elements.cp.value.replace(/\D/g, ""), ciudad: form.elements.ciudad.value.trim(), provincia: form.elements.provincia.value });
  const plazo = (e) => (e.min && e.max ? (e.min === e.max ? `${e.max} días hábiles` : `${e.min} a ${e.max} días hábiles`) : "");
  function cotizarEnvio() {
    if (PRE || !domicilio()) return;
    const d = envDatos();
    const k = JSON.stringify([d, DS.getCart().map((l) => [l.productId, l.size, l.qty])]);
    if (k === envKey) return;
    envKey = k; ENV = null;
    if (d.cp.length !== 4 || !d.ciudad || !d.provincia) { render(); return; }
    ENV = { modo: "cargando" }; render();
    clearTimeout(envTimer);
    const seq = ++envSeq;
    envTimer = setTimeout(async () => {
      let r = null;
      try {
        const x = await fetch("/api/envio", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ...d, items: DS.getCart() }) });
        r = await x.json().catch(() => null);
      } catch {}
      if (seq !== envSeq) return;
      ENV = r && r.modo === "zipnova" ? r : { modo: "coordinar", error: (r && r.error) || "" };
      render();
    }, 500);
  }
  const envioMonto = () => (ENV && ENV.modo === "zipnova" && domicilio() && !PRE ? ENV.precio : 0);
  const conEnvioZn = () => ENV && ENV.modo === "zipnova" && domicilio() && !PRE;

  let lastLines = null;
  function render() {
    const cart = DS.getCart();
    if (!PRE && !cart.length && $("done").hidden) {
      $("checkout").innerHTML = `<div class="done" style="grid-column:1/-1"><h1>Tu carrito está vacío</h1><p>Elegí una obra para empezar.</p><a class="btn btn-dark" href="/#obras">Ver la colección</a></div>`;
      return;
    }
    const linesHtml = PRE
      ? PRE.items.map((i) => `<div class="line pre"><div class="line-info"><h4>${DS.esc(i.desc)}</h4><small>Cantidad: ${i.cant}</small></div><div class="line-right">${DS.money(i.precio)}</div></div>`).join("")
        + (PRE.nota ? `<p class="pre-nota">${DS.esc(PRE.nota)}</p>` : "")
      : cart.map((l, i) => {
      const p = DS.product(l.productId);
      return `<div class="line"><div class="line-thumb">${DS.framed(p, l)}</div><div class="line-info"><h4>${DS.esc(p.name)}</h4><small>${DS.esc(DS.variantText(l))}</small><small>Cantidad: ${l.qty}</small></div><button type="button" class="line-rm" data-quitar="${i}" aria-label="Quitar ${DS.esc(p.name)} del carrito" title="Quitar del carrito">×</button><div class="line-right">${DS.money(DS.unitPrice(l) * l.qty)}</div></div>`;
    }).join("");
    // solo se redibuja si cambió (si no, un clic en la × se pierde cuando otro campo dispara render)
    if (lastLines !== linesHtml) { $("sumLines").innerHTML = linesHtml; lastLines = linesHtml; }
    const sub = subTotal();
    const transfer = val("pago") === "Transferencia";
    const disc = transfer && discOn() ? sub * st.transferDiscount : 0;
    $("sSub").textContent = DS.money(sub);
    $("sDiscRow").hidden = !transfer;
    $("sDisc").textContent = "−" + DS.money(disc);
    $("sDiscRow").hidden = !disc;
    $("sShip").textContent = PRE && PRE.envio ? "Incluido" : !domicilio() ? "Gratis"
      : ENV && ENV.modo === "zipnova" ? (ENV.precio ? DS.money(ENV.precio) : "Gratis") : ENV && ENV.modo === "cargando" ? "Calculando…" : ENV ? "A coordinar" : "Ingresá tu CP";
    $("sTotal").textContent = DS.money(sub - disc + envioMonto());
    const q = $("shipQuote");
    q.hidden = PRE || !domicilio() || !ENV;
    const precioTxt = (e) => !e.precio ? `<b>Envío gratis</b>` : e.bonif ? `<b>Envío ${DS.money(e.precio)}</b> <s>${DS.money(e.costo)}</s> (te bonificamos ${DS.money(e.bonif)})` : `<b>Envío ${DS.money(e.precio)}</b>`;
    if (ENV) q.innerHTML = ENV.modo === "zipnova" ? `${precioTxt(ENV)} · ${DS.esc(ENV.carrier)}${plazo(ENV) ? ` · llega en ${plazo(ENV)} desde que lo despachamos` : ""}`
      : ENV.modo === "cargando" ? "Calculando el envío…" : `${DS.esc(ENV.error || "No pudimos calcular el envío")}. Podés seguir igual: te escribimos para coordinarlo.`;
    $("addr").hidden = val("entrega") !== "Envío a domicilio";
    $("payBtn").textContent = transfer ? "Confirmar pedido" : "Continuar al pago";
  }
  form.addEventListener("change", () => { render(); cotizarEnvio(); });
  form.addEventListener("input", (e) => { e.target.style.borderColor = ""; if (["cp", "ciudad"].includes(e.target.name)) { clearTimeout(envTimer); envTimer = setTimeout(cotizarEnvio, 900); } });
  render();
  // el carrito lateral también puede cambiar el pedido
  new MutationObserver(() => { render(); cotizarEnvio(); }).observe($("cartBody"), { childList: true });

  $("sumLines").addEventListener("click", (e) => {
    const q = e.target.closest("[data-quitar]"); if (!q) return;
    const c = DS.getCart(); c.splice(+q.dataset.quitar, 1); DS.setCart(c);
    render(); cotizarEnvio();
  });
  document.addEventListener("click", async (e) => {
    const b = e.target.closest("[data-copy]"); if (!b) return;
    try { await navigator.clipboard.writeText(b.dataset.copy); } catch {}
    b.textContent = "¡Copiado!"; setTimeout(() => (b.textContent = "Copiar"), 1500);
  });
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const err = $("err"); err.hidden = true;
    const required = ["email", "nombre", "telefono"];
    if (val("entrega") === "Envío a domicilio") required.push("direccion", "numero", "cp", "ciudad", "provincia", "dni");
    const missing = required.filter((n) => !form.elements[n].value.trim());
    required.forEach((n) => form.elements[n].style.borderColor = missing.includes(n) ? "#a12d1c" : "");
    if (missing.length || !form.elements.email.checkValidity()) {
      err.textContent = "Completá los campos marcados para continuar."; err.hidden = false; return;
    }
    const cart = DS.getCart(); if (!PRE && !cart.length) return;
    if (!PRE && domicilio() && (!ENV || ENV.modo === "cargando")) {
      cotizarEnvio(); err.textContent = "Estamos calculando el envío, esperá un segundo y volvé a intentar."; err.hidden = false; return;
    }
    const transfer = val("pago") === "Transferencia";
    const conDesc = transfer && discOn();
    const sub = subTotal();
    const envio = envioMonto();
    const total = (conDesc ? sub * (1 - st.transferDiscount) : sub) + envio;
    $("fEnvio").value = PRE ? (PRE.envio ? DS.money(PRE.envio) : "") : !domicilio() ? "Retiro por el estudio"
      : conEnvioZn() ? `${envio ? DS.money(envio) : "Gratis"} (${ENV.carrier}${ENV.bonif ? `, bonificamos ${DS.money(ENV.bonif)} de ${DS.money(ENV.costo)}` : ""})` : "A coordinar";
    const orden = PRE ? PRE.id : "DS-" + Date.now().toString(36).toUpperCase();
    $("fOrden").value = orden;
    $("fDetalle").value = (PRE ? "PEDIDO A MEDIDA\n" : "") + detalle();
    $("fTotal").value = DS.money(total) + (conDesc ? ` (con ${pct}% OFF transferencia)` : "");
    if (PRE) $("fComision").value = "";
    else {
      const com = DS.comisiones(cart, transfer ? 1 - st.transferDiscount : 1);
      $("fComision").value = Object.entries(com).map(([who, x]) => `${who}: ${DS.money(x.total)} — ${x.obras.join(", ")}`).join("\n");
    }

    const btn = $("payBtn"); btn.disabled = true; btn.textContent = "Procesando…";
    try {
      await DS.submitForm("pedido", new FormData(form));
      const g = (n) => (form.elements[n] ? form.elements[n].value : "");
      DS.notifyMail(`${PRE ? "Pago de pedido a medida" : "Nueva compra en la web"} (${g("orden")}) — ${g("nombre")} — ${g("total")}`, {
        "N° de pedido": g("orden"), "Detalle": g("detalle"), "Envío": g("envio"), "Total": g("total"), "Forma de pago": val("pago"),
        "Nombre": g("nombre"), "Email": g("email"), "Teléfono": g("telefono"), "Entrega": val("entrega"),
        "Dirección": [[g("direccion"), g("numero")].filter(Boolean).join(" "), g("depto"), g("cp"), g("ciudad"), g("provincia")].filter(Boolean).join(", "), "DNI": g("dni"),
        "Comentarios": g("comentarios"), "Comisión fotógrafas (interno)": g("comision_fotografas"),
      });
      const body = {
        ...(PRE ? { presupuesto: PTOK } : { items: cart }), orderId: orden, pago: transfer ? "transferencia" : "mercadopago",
        entrega: domicilio() ? "domicilio" : "retiro", envio: conEnvioZn() ? ENV.token : null,
        buyer: { name: g("nombre"), email: g("email"), phone: g("telefono"), dni: g("dni") },
        address: { calle: g("direccion"), numero: g("numero"), depto: g("depto"), cp: g("cp"), ciudad: g("ciudad"), provincia: g("provincia") },
      };
      const r = await fetch("/api/checkout", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }).catch(() => null);
      const data = r ? await r.json().catch(() => ({})) : {};
      if (!transfer) {
        if (data.mode === "mercadopago" && data.url) { location.href = data.url; return; }
        if (data.mode !== "manual") throw new Error(data.error || "pago");
      }
      if (!PRE) DS.setCart([]);
      $("checkout").hidden = true; $("done").hidden = false; window.scrollTo(0, 0);
      $("dTitle").textContent = "¡Recibimos tu pedido!";
      if (transfer) {
        const bk = st.bank || {};
        $("dTitle").textContent = "Último paso: transferí";
        $("dText").innerHTML = `Tu número de pedido es <b>${orden}</b>.<br>Transferí <b>${DS.money(total)}</b>${envio ? " (incluye el envío)" : conEnvioZn() ? " (el envío es gratis)" : ""} a esta cuenta y envianos el comprobante para confirmar tu compra.`;
        const row = (k, v, copy) => `<div class="bank-row"><span>${k}</span><b>${DS.esc(v)}</b>${copy ? `<button type="button" class="copy" data-copy="${DS.esc(v)}">Copiar</button>` : ""}</div>`;
        $("dBank").hidden = false;
        $("dBank").innerHTML = row("Monto", DS.money(total), true).replace(`data-copy="${DS.money(total)}"`, `data-copy="${Math.round(total)}"`)
          + row("Alias", bk.alias, true) + row("CBU", bk.cbu, true) + row("Titular", bk.titular) + row("Banco", bk.banco);
        const msg = encodeURIComponent(`Hola! Te envío el comprobante de transferencia del pedido ${orden} por ${DS.money(total)}.`);
        $("dWa").hidden = false; $("dWa").href = `https://wa.me/5491153132340?text=${msg}`;
      } else {
        $("dText").innerHTML = `Tu número de pedido es <b>${orden}</b>. Te vamos a escribir a la brevedad con el link de pago.`;
      }
    } catch (x) {
      const m = x && x.message && x.message !== "pago" && !/fetch|network/i.test(x.message) ? x.message : "No pudimos iniciar el pago. Probá de nuevo en un momento o elegí transferencia.";
      err.textContent = m; err.hidden = false;
      if (/envío/.test(m)) { envKey = ""; cotizarEnvio(); }
    } finally {
      btn.disabled = false; render();
    }
  });
})();
</script>
</body>
</html>
