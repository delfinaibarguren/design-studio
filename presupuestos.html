<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Presupuestos | Dsgn. Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600&family=Poppins:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,800&family=Work+Sans:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/styles.css">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <style>
    .adm { max-width: 820px; margin: 0 auto; padding: 40px var(--gutter) 80px; }
    .adm h1 { font-family: "Playfair Display", Georgia, serif; font-size: 2.4rem; margin: 0 0 .3rem; }
    .adm .sub { color: var(--ink-soft); margin: 0 0 1.6rem; }
    .it { display: grid; grid-template-columns: minmax(0, 1fr) 80px 140px 34px; gap: .5rem; align-items: end; margin-bottom: .5rem; }
    .it button { height: 44px; border: 0; background: none; font-size: 1.3rem; cursor: pointer; color: var(--ink-soft); }
    .adm .q-add { margin-top: .3rem; }
    .totrow { display: flex; justify-content: space-between; font-size: 1.1rem; margin-top: 1rem; padding-top: .8rem; border-top: 1px solid var(--line); }
    .res { margin-top: 1.4rem; }
    .res input { font-size: .85rem; }
    .res .acts { display: flex; gap: .6rem; flex-wrap: wrap; margin-top: .7rem; }
    .chk { display: flex; gap: .5rem; align-items: center; margin-top: .8rem; font-size: .95rem; }
    .chk input { width: auto; accent-color: var(--ink); }
    @media (max-width: 560px) { .it { grid-template-columns: 1fr 70px 34px; } .it .f-precio { grid-column: 1 / 3; } }
  </style>
</head>
<body>
<main class="adm">
  <h1>Link de pago a medida</h1>
  <p class="sub">Armá el presupuesto aceptado y mandale el link al cliente. Ahí completa su dirección y paga con tarjeta o transferencia.</p>

  <div class="box">
    <div class="fields">
      <label class="f">Clave<input type="password" id="key" autocomplete="current-password"></label>
      <label class="f">Nombre del cliente<input id="cliente" placeholder="Ej: Ana López"></label>
    </div>
  </div>

  <div class="box">
    <h2>Ítems</h2>
    <div id="items"></div>
    <button type="button" class="q-add" id="add">+ Agregar ítem</button>
    <div class="fields" style="margin-top:1rem">
      <label class="f">Envío ($, opcional)<input id="envio" inputmode="numeric" placeholder="0 = a coordinar"></label>
      <label class="f">Válido por (días)<input id="dias" inputmode="numeric" value="15"></label>
      <label class="f full">Nota para el cliente (opcional)<input id="nota" placeholder="Ej: entrega en 10 días hábiles"></label>
    </div>
    <label class="chk"><input type="checkbox" id="desc" checked> Aplicar 10% OFF si paga por transferencia</label>
    <div class="totrow"><span>Total</span><b id="tot">$0</b></div>
  </div>

  <button class="btn btn-dark btn-block" id="gen">Generar link de pago</button>
  <p class="q-err" id="err" hidden></p>

  <div class="box res" id="res" hidden>
    <h2>Link listo <small id="rid"></small></h2>
    <input id="link" readonly>
    <div class="acts">
      <button class="btn btn-outline" id="copy" type="button">Copiar link</button>
      <a class="btn btn-dark" id="wa" target="_blank" rel="noopener">Mandar por WhatsApp</a>
      <a class="btn btn-outline" id="ver" target="_blank" rel="noopener">Ver como el cliente</a>
    </div>
  </div>
</main>
<script src="/assets/store.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const money = (n) => "$" + Math.round(n).toLocaleString("es-AR");
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  try { $("key").value = localStorage.getItem("ds-admin-key") || ""; } catch {}
  const items = [{ desc: "", cant: 1, precio: "" }];
  const num = (v) => Number(String(v).replace(/[^\d]/g, "")) || 0;
  const draw = () => {
    $("items").innerHTML = items.map((it, i) => `<div class="it">
      <label class="f">Descripción<input data-i="${i}" data-k="desc" value="${esc(it.desc)}" placeholder="Ej: Cuadro 60x60 chato negro sin paspartú"></label>
      <label class="f">Cant.<input data-i="${i}" data-k="cant" inputmode="numeric" value="${esc(it.cant)}"></label>
      <label class="f f-precio">Precio total del ítem<input data-i="${i}" data-k="precio" inputmode="numeric" value="${esc(it.precio)}" placeholder="$"></label>
      <button type="button" data-rm="${i}" aria-label="Quitar"${items.length < 2 ? " hidden" : ""}>×</button></div>`).join("");
    total();
  };
  const total = () => { $("tot").textContent = money(items.reduce((a, i) => a + num(i.precio), 0) + num($("envio").value)); };
  $("items").addEventListener("input", (e) => { const t = e.target.closest("[data-k]"); if (t) { items[+t.dataset.i][t.dataset.k] = t.value; total(); } });
  $("items").addEventListener("click", (e) => { const b = e.target.closest("[data-rm]"); if (b) { items.splice(+b.dataset.rm, 1); draw(); } });
  $("add").onclick = () => { items.push({ desc: "", cant: 1, precio: "" }); draw(); };
  $("envio").oninput = total;
  draw();

  $("gen").onclick = async () => {
    $("err").hidden = true; $("res").hidden = true;
    const body = { key: $("key").value.trim(), cliente: $("cliente").value, envio: num($("envio").value), dias: num($("dias").value) || 15,
      nota: $("nota").value, descTransfer: $("desc").checked, items: items.map((i) => ({ desc: i.desc, cant: num(i.cant) || 1, precio: num(i.precio) })) };
    const b = $("gen"); b.disabled = true; b.textContent = "Generando…";
    try {
      const r = await fetch("/api/presupuesto", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || "No se pudo generar");
      try { localStorage.setItem("ds-admin-key", body.key); } catch {}
      $("link").value = d.url; $("rid").textContent = "· " + d.id; $("ver").href = d.url;
      const nombre = body.cliente.trim().split(" ")[0];
      const msg = `Hola${nombre ? " " + nombre : ""}! Te paso el link para confirmar tu pedido a medida. Ahí completás tus datos de envío y elegís pagar con tarjeta (hasta 3 cuotas) o transferencia${body.descTransfer ? " (10% OFF)" : ""}: ${d.url}`;
      $("wa").href = "https://wa.me/?text=" + encodeURIComponent(msg);
      $("res").hidden = false; $("res").scrollIntoView({ behavior: "smooth" });
    } catch (x) { $("err").textContent = x.message; $("err").hidden = false; }
    finally { b.disabled = false; b.textContent = "Generar link de pago"; }
  };
  $("copy").onclick = async () => { try { await navigator.clipboard.writeText($("link").value); } catch { $("link").select(); } $("copy").textContent = "¡Copiado!"; setTimeout(() => ($("copy").textContent = "Copiar link"), 1500); };
})();
</script>
</body>
</html>
