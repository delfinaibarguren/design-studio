<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Design Studio | Enmarcados personalizados.</title>
  <meta name="description" content="Fotografías enmarcadas a tu medida: elegí la obra, el marco y la terminación. 3 cuotas sin interés y 10% OFF por transferencia. Envíos a todo el país.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Design Studio">
  <meta property="og:title" content="Design Studio | Enmarcados personalizados.">
  <meta property="og:description" content="Fotografías enmarcadas a tu medida: elegí la obra, el marco y la terminación. 3 cuotas sin interés y 10% OFF por transferencia. Envíos a todo el país.">
  <meta property="og:url" content="https://design-studio-cuadros.netlify.app/">
  <meta property="og:image" content="https://design-studio-cuadros.netlify.app/assets/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600&family=Poppins:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,800&family=Work+Sans:wght@300;400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/styles.css">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
</head>
<body>
<div id="ds-header"></div>

<main>
  <section class="hero hero-v2">
    <div>
      <h1><span class="h-light">Enmarcados</span><span class="h-bold">personalizados.</span></h1>
      <p class="hero-sub hero-sub-3"><span>Elegí la obra, la medida y</span><span>personalizá tu enmarcado.</span><strong>Te la enviamos lista para colgar.</strong></p>
      <a href="#colecciones" class="hero-btn">Ver colecciones</a>
    </div>
    <div class="hero-img hero-carrusel" id="heroCar">
      <img class="on" src="/assets/home-ponis.jpg" alt="Cuadro con la fotografía Ponis en blanco y negro, marco negro y paspartú blanco, colgado en una pared">
      <img src="/assets/obras/sombrero-ambiente-1.jpg" alt="Cuadro Sombrero de la colección Origen en un living" loading="lazy">
      <img src="/assets/obras/faro-ambiente-1.jpg" alt="Cuadro Faro de la colección Terra en un dormitorio" loading="lazy">
      <img src="/assets/obras/tranvia-ambiente-1.jpg" alt="Cuadro Movimiento de la colección Urbe" loading="lazy">
      <img src="/assets/obras/girasoles-ambiente-1.jpg" alt="Cuadro Girasoles de la colección Pampa en un living" loading="lazy">
    </div>
  </section>

  <div class="perks4">
    <div><svg viewBox="0 0 24 24" width="52" height="52" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="M3 10h18M14.5 14.5h3"/></svg><strong>3 cuotas sin interés</strong><span>Con todas las tarjetas</span></div>
    <div><svg viewBox="0 0 24 24" width="52" height="52" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 7V5.5A1.5 1.5 0 0 0 16.5 4h-11A2.5 2.5 0 0 0 3 6.5v11A2.5 2.5 0 0 0 5.5 20h12a1.5 1.5 0 0 0 1.5-1.5V16"/><path d="M3 6.5A2.5 2.5 0 0 0 5.5 9h13A1.5 1.5 0 0 1 20 10.5V16h-4a2.5 2.5 0 0 1 0-5h4"/><circle cx="16" cy="13.5" r=".6" fill="currentColor"/></svg><strong>10% OFF</strong><span>Por transferencia</span></div>
    <div><svg viewBox="0 0 24 24" width="52" height="52" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 6.5h11v9.5h-11z"/><path d="M13.5 9.5h4l3.5 3.5v3h-7.5"/><circle cx="6.5" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg><strong>Envíos a todo el país</strong><span>Gratis en AMBA desde $250.000</span></div>
  </div>

  <section class="section" id="colecciones">
    <div class="section-head"><h2>Colecciones</h2></div>
    <div class="col-grid" id="colGrid"></div>
  </section>
</main>

<div id="ds-footer"></div>

<!-- Definición del formulario de suscripción para Netlify Forms -->
<form name="novedades" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input name="bot-field"><input type="email" name="email">
</form>

<script src="/assets/store.js"></script>
<script>
(async () => {
  const c = await DS.init();
  // enlaces viejos ?categoria=x → página de la colección
  const old = new URLSearchParams(location.search).get("categoria");
  if (old && DS.category(old)) { location.replace(`/coleccion.html?c=${old}`); return; }
  document.getElementById("colGrid").innerHTML = c.categories.map(DS.collectionCard).join("");
})();
</script>
<script>
// carrusel de la portada: cambia de foto cada 1,5 segundos (se frena si el usuario pidió menos movimiento)
(() => {
  const imgs = [...document.querySelectorAll("#heroCar img")]; let i = 0;
  if (imgs.length < 2 || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  setInterval(() => { if (document.hidden) return; imgs[i].classList.remove("on"); i = (i + 1) % imgs.length; imgs[i].classList.add("on"); }, 1500);
})();
</script>
</body>
</html>
