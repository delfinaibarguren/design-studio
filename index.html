</head>
<body>
<div id="ds-header"></div>

<main>
  <section class="hero hero-v2">
    <div>
      <h1><span class="h-light">Enmarcados</span><span class="h-bold">personalizados.</span></h1>
      <p class="hero-sub">Elegí la obra, la medida y el color de marco.<br><strong>Te la enviamos lista para colgar.</strong></p>
      <a href="#colecciones" class="hero-btn">Ver colecciones</a>
    </div>
    <div class="hero-img"><img src="/assets/home-ponis.jpg" alt="Cuadro con la fotografía Ponis en blanco y negro, marco negro y paspartú blanco, colgado en una pared"></div>
  </section>

  <div class="perks4">
    <div><svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="M3 10h18M14.5 14.5h3"/></svg><strong>3 cuotas sin interés</strong><span>Con todas las tarjetas</span></div>
    <div><svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 7V5.5A1.5 1.5 0 0 0 16.5 4h-11A2.5 2.5 0 0 0 3 6.5v11A2.5 2.5 0 0 0 5.5 20h12a1.5 1.5 0 0 0 1.5-1.5V16"/><path d="M3 6.5A2.5 2.5 0 0 0 5.5 9h13A1.5 1.5 0 0 1 20 10.5V16h-4a2.5 2.5 0 0 1 0-5h4"/><circle cx="16" cy="13.5" r=".6" fill="currentColor"/></svg><strong>10% OFF</strong><span>Por transferencia</span></div>
    <div><svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 6.5h11v9.5h-11z"/><path d="M13.5 9.5h4l3.5 3.5v3h-7.5"/><circle cx="6.5" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg><strong>Envíos a todo el país</strong><span>Recibí tu cuadro en casa</span></div>
  </div>

  <section class="section" id="colecciones">
    <div class="section-head"><h2>Colecciones</h2></div>
    <div class="col-grid" id="colGrid"></div>
  </section>
</main>

<div id="ds-footer"></div>

<!-- Definición del formulario de suscripción para Netlify Forms -->
<form name="novedades" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input name="bot-field"><input type="email" name="email">
</form>

<script src="/assets/store.js"></script>
<script>
(async () => {
  const c = await DS.init();
  // enlaces viejos ?categoria=x → página de la colección
  const old = new URLSearchParams(location.search).get("categoria");
  if (old && DS.category(old)) { location.replace(`/coleccion.html?c=${old}`); return; }
  document.getElementById("colGrid").innerHTML = c.categories.map(DS.collectionCard).join("");
})();
</script>
</body>
</html>
