<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gracias — Design Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Poppins:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,800&family=Work+Sans:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/styles.css">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
</head>
<body>
<div id="ds-header"></div>
<main class="done" style="min-height:60vh">
  <h1 id="t">¡Gracias por tu compra!</h1>
  <p id="m">Tu pago fue aprobado. Te vamos a escribir para coordinar el envío de tu cuadro.</p>
  <a class="btn btn-dark" href="/">Volver a la tienda</a>
</main>
<div id="ds-footer"></div>
<script src="/assets/store.js"></script>
<script>
(async () => {
  const e = new URLSearchParams(location.search).get("estado");
  await DS.init();
  if (e === "ok") DS.setCart([]);
  const t = document.getElementById("t"), m = document.getElementById("m");
  if (e === "pendiente") { t.textContent = "Tu pago está en proceso"; m.textContent = "Cuando Mercado Pago lo confirme te avisamos por email para coordinar el envío."; DS.setCart([]); }
  if (e === "error") { t.textContent = "El pago no se completó"; m.textContent = "No se realizó ningún cobro. Tu carrito sigue guardado: podés intentarlo de nuevo."; }
  // pago aprobado: confirmamos con Mercado Pago y mostramos el seguimiento del envío
  const q = new URLSearchParams(location.search), pago = q.get("payment_id") || q.get("collection_id");
  if (e === "ok" && pago && /^\d+$/.test(pago)) {
    m.textContent = "Tu pago fue aprobado. Estamos generando tu envío…";
    let d = null;
    try { d = await (await fetch("/api/confirmar?pago=" + pago)).json(); } catch {}
    if (d && d.envio) {
      const seg = d.envio.tracking ? `<a href="${DS.esc(d.envio.tracking)}" target="_blank" rel="noopener">seguí tu envío acá</a>` : "";
      m.innerHTML = `Tu pago fue aprobado (pedido <b>${DS.esc(d.orden)}</b>). Preparamos tu cuadro y lo despachamos con <b>${DS.esc(d.envio.carrier)}</b>.`
        + (d.envio.seguimiento ? `<br>Número de seguimiento: <b>${DS.esc(d.envio.seguimiento)}</b>` : "") + (seg ? `<br>Podés ${seg}.` : "")
        + `<br><small>Guardá esta página o hacé una captura para tener tu número de seguimiento.</small>`;
    } else if (d && d.orden && d.retiro) {
      m.innerHTML = `Tu pago fue aprobado (pedido <b>${DS.esc(d.orden)}</b>). Elegiste <b>retirar por el taller en Del Viso, Pilar</b>: cuando tu cuadro esté listo te escribimos por WhatsApp para coordinar día y horario.`;
    } else if (d && d.orden) {
      m.innerHTML = `Tu pago fue aprobado (pedido <b>${DS.esc(d.orden)}</b>). Te escribimos a la brevedad con los datos del envío.`;
    } else {
      m.textContent = "Tu pago fue aprobado. Te escribimos a la brevedad con los datos del envío.";
    }
    let aviso = false; try { aviso = sessionStorage.getItem("aviso-" + pago) === "1"; sessionStorage.setItem("aviso-" + pago, "1"); } catch {}
    if (d && d.orden && !aviso) DS.notifyMail(`Pago aprobado (${d.orden})${d.envio ? " — envío creado" : ""}`, {
      "N° de pedido": d.orden, "Pago Mercado Pago": pago,
      "Envío": d.envio ? `${d.envio.carrier} · seguimiento ${d.envio.seguimiento || "(en proceso)"}` : d.envioError ? "No se pudo crear: revisalo en la página de pedidos" : d.retiro ? "Retiro por el taller (coordinar por WhatsApp)" : "A coordinar",
      "Etiqueta para imprimir": d.etiqueta || "", "Página de pedidos": location.origin + "/pedidos.html",
    });
  }
})();
</script>
</body>
</html>
